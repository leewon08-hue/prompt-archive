<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prompt Archive</title><meta name="description" content="페소 프롬프트와 행동 프롬프트 아카이브">
<style>
:root{--ink:#393435;--muted:#918684;--line:#e9dfdc;--paper:#fffdfa;--rose:#b78b91;--pale:#f6eeed}
*{box-sizing:border-box}body{margin:0;background:#f8f5f2;color:var(--ink);font-family:Georgia,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}
.wrap{max-width:900px;margin:35px auto;background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 12px 40px #4c33330a}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 28px;border-bottom:1px solid var(--line)}.brand{font-size:11px;letter-spacing:2px;font-weight:bold}.brand b{font-size:19px;color:var(--rose);margin-right:7px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;font-size:12px;color:var(--ink)}.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.hero{padding:45px 34px 36px;background:linear-gradient(130deg,#fbf1ef,#fffdfa 65%,#f6f0ef)}.kicker{font-size:10px;letter-spacing:3px;color:var(--rose)}h1{font-size:clamp(36px,7vw,58px);line-height:1.12;letter-spacing:-2px;font-weight:500;margin:15px 0}h1 em{color:var(--rose);font-weight:400}.hero p{color:var(--muted);font-size:13px;margin:0 0 24px}.stats{font-size:10px;letter-spacing:1.5px;color:var(--muted)}.stats strong{color:var(--ink)}
.tabs{display:flex;gap:26px;padding:0 27px;border-bottom:1px solid var(--line)}.tab{background:none;border:0;border-bottom:2px solid transparent;padding:17px 4px 14px;color:#9c9290;font-size:13px}.tab.active{color:var(--ink);border-color:var(--rose);font-weight:bold}.tab small{background:var(--pale);padding:3px 7px;border-radius:10px;margin-left:5px}
.toolbar{display:flex;gap:10px;padding:20px 27px}.toolbar input{flex:1;min-width:0;border:1px solid var(--line);background:#faf7f5;border-radius:9px;padding:11px 13px;font-size:12px;outline:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:0 27px 30px}.card{border:1px solid var(--line);border-radius:12px;padding:18px;background:white;min-width:0}.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.tag{font-size:9px;letter-spacing:1.2px;color:var(--rose);background:var(--pale);padding:5px 8px;border-radius:5px}
.preview{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px;margin:0 0 13px;background:#f7f1ef;display:block}.card h3{font-size:15px;line-height:1.5;margin:0 0 10px;overflow-wrap:anywhere}.content{font-family:Arial,sans-serif;font-size:12px;line-height:1.8;color:#817876;white-space:pre-wrap;overflow-wrap:anywhere;max-height:180px;overflow:auto}
.card-actions{display:flex;gap:7px;margin-top:16px;padding-top:12px;border-top:1px solid #f1ece8}.copy{flex:1;border:0;background:var(--pale);border-radius:7px;padding:9px;color:#866b6e;font-size:11px}.admin-actions{display:flex;gap:5px}.admin-actions button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 9px;font-size:11px;color:var(--muted)}
.empty{text-align:center;padding:40px 15px;color:var(--muted);font-size:13px;line-height:2}footer{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:18px 27px;color:#b4a8a4;font-size:9px;letter-spacing:2px}
.modal-back{position:fixed;inset:0;background:#211a1a80;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal-back.open{display:flex}.modal{width:min(540px,100%);background:white;border-radius:14px;padding:20px}.modal h2{font-size:16px;margin:0 0 15px}.modal input,.modal textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px;margin:7px 0;font-size:13px}.modal textarea{min-height:180px;resize:vertical;line-height:1.6}.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.notice{font-size:12px;color:var(--muted);line-height:1.7;margin:10px 0}.hidden{display:none!important}
@media(max-width:580px){.wrap{margin:0;border-radius:0}.hero{padding:35px 22px}.grid{grid-template-columns:1fr;padding:0 16px 22px}.tabs{padding:0 14px;gap:14px}.toolbar{padding:16px}header{padding:18px}}
</style></head>
<body><div class="wrap">
<header><div class="brand"><b>✳</b> PROMPT ARCHIVE</div><button id="authBtn" class="btn">관리자 로그인</button></header>
<section class="hero"><div class="kicker">A LITTLE WORLD OF PROMPTS</div><h1>나만의 프롬프트<br><em>아카이브.</em></h1><p>마음에 드는 장면과 캐릭터를 기록하는 곳.</p><div class="stats"><strong id="total">00</strong> PROMPTS <span style="margin:0 8px">·</span> TWO COLLECTIONS</div></section>
<nav class="tabs"><button class="tab active" data-tab="persona">✧ 페소 프롬 <small id="personaCount">0</small></button><button class="tab" data-tab="action">♡ 행동 프롬프트 <small id="actionCount">0</small></button></nav>
<div class="toolbar"><input id="search" placeholder="프롬프트 검색하기..." aria-label="프롬프트 검색"><button id="addBtn" class="btn dark hidden">＋ 새 프롬프트</button></div>
<div id="grid" class="grid"></div><div id="empty" class="empty hidden">아직 프롬프트가 없어요.<br>첫 번째 기록을 남겨보세요. ✧</div>
<footer>MADE WITH LOVE & PROMPTS <span>✳</span></footer></div>
<div id="modalBack" class="modal-back"><div class="modal"><h2 id="modalTitle">프롬프트 작성</h2><input id="promptTitle" placeholder="프롬프트 제목"><label class="notice" for="promptImage">미리보기 이미지 (선택 · 최대 8MB)</label><input id="promptImage" type="file" accept="image/*"><div id="imageCurrent" class="notice">이미지를 올리면 카드에 미리보기로 표시됩니다.</div><textarea id="promptBody" placeholder="프롬프트 내용을 입력하세요"></textarea><div class="actions"><button id="cancel" class="btn">취소</button><button id="save" class="btn dark">저장하기</button></div></div></div>
<div id="authBack" class="modal-back"><div class="modal"><h2>관리자 로그인</h2><p class="notice">Supabase 설정 후 관리자 계정으로 로그인하세요.</p><input id="email" type="email" placeholder="관리자 이메일"><input id="password" type="password" placeholder="비밀번호"><div class="actions"><button id="authCancel" class="btn">취소</button><button id="login" class="btn dark">로그인</button></div><p id="authMsg" class="notice"></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
/* Fill in your Supabase project URL and anon/public key. Never use service_role here. */
const SUPABASE_URL="https://gmvrfgmwjemapwcblweu.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_qU_4bWhl9ZeKrs5_p9DAhA_oYVObwee";
const IMAGE_BUCKET="prompt-images";
const configured=SUPABASE_URL.startsWith("https://")&&!SUPABASE_URL.includes("PASTE_")&&!SUPABASE_ANON_KEY.includes("PASTE_");
const db=configured?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
let items=[],category="persona",user=null,editing=null,existingImage=null;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){const shown=items.filter(x=>x.category===category&&(x.title+" "+x.body).toLowerCase().includes($("search").value.toLowerCase()));
$("grid").innerHTML=shown.map(x=>`<article class="card"><div class="card-top"><span class="tag">${x.category==="persona"?"PERSONA PROMPT":"ACTION PROMPT"}</span></div>${x.image_url?`<img class="preview" src="${esc(x.image_url)}" alt="${esc(x.title)}" loading="lazy">`:""}<h3>${esc(x.title)}</h3><div class="content">${esc(x.body)}</div><div class="card-actions"><button class="copy" data-copy="${esc(x.id)}">▣ 프롬프트 복사</button>${user?`<div class="admin-actions"><button data-edit="${esc(x.id)}">수정</button><button data-del="${esc(x.id)}">삭제</button></div>`:""}</div></article>`).join("");
$("empty").classList.toggle("hidden",shown.length>0);$("total").textContent=items.length;$("personaCount").textContent=items.filter(x=>x.category==="persona").length;$("actionCount").textContent=items.filter(x=>x.category==="action").length;$("addBtn").classList.toggle("hidden",!user);$("authBtn").textContent=user?"로그아웃":"관리자 로그인";document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===category));}
async function load(){if(!db){items=[{id:"sample1",category:"persona",title:"몽환적인 수국빛 페소",body:"beautiful ethereal young woman, hydrangea-blue hair with soft lavender undertones, luminous blue-violet eyes, delicate features, dreamy atmosphere"},{id:"sample2",category:"persona",title:"무심한 흑발 남캐",body:"handsome young man, short jet-black hair, half-parted bangs, cold aloof expression, sharp facial features, deep black eyes"},{id:"sample3",category:"action",title:"바다를 바라보는 계단",body:"sitting on wide stone steps beside the sea, gazing at the distant ocean, photographed from far away, expansive ocean view"},{id:"sample4",category:"action",title:"꽃잎을 뜯는 순간",body:"sitting alone on outdoor steps, gently picking apart flower petals, quiet contemplative mood, soft natural light"}];render();return;}
const {data,error}=await db.from("prompts").select("*").order("created_at",{ascending:false});if(error){alert("불러오기 실패: "+error.message);return;}items=data||[];render();}
function openEditor(x){editing=x?.id||null;existingImage=x?.image_url||null;$("modalTitle").textContent=x?"프롬프트 수정":"새 프롬프트 작성";$("promptTitle").value=x?.title||"";$("promptBody").value=x?.body||"";$("promptImage").value="";$("imageCurrent").innerHTML=existingImage?`현재 이미지: <a href="${esc(existingImage)}" target="_blank" rel="noopener">미리보기 열기</a> · 새 이미지를 선택하면 교체됩니다.`:"선택한 이미지가 카드 미리보기에 표시됩니다.";$("modalBack").classList.add("open");}
function closeEditor(){$("modalBack").classList.remove("open");editing=null;}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{category=b.dataset.tab;render()});$("search").oninput=render;$("addBtn").onclick=()=>openEditor(null);$("cancel").onclick=closeEditor;
$("save").onclick=async()=>{const title=$("promptTitle").value.trim(),body=$("promptBody").value.trim();if(!title||!body)return alert("제목과 내용을 모두 입력해 주세요.");if(!db)return alert("실제 저장을 위해 Supabase 설정을 먼저 완료해 주세요.");
let image_url=existingImage,file=$("promptImage").files[0];if(file){if(!file.type.startsWith("image/"))return alert("이미지 파일만 올릴 수 있어요.");if(file.size>8*1024*1024)return alert("이미지는 8MB 이하로 선택해 주세요.");const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";const objectPath=`${user.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;const up=await db.storage.from(IMAGE_BUCKET).upload(objectPath,file,{upsert:false,contentType:file.type});if(up.error)return alert("이미지 업로드 실패: "+up.error.message);image_url=db.storage.from(IMAGE_BUCKET).getPublicUrl(objectPath).data.publicUrl;}
const payload={title,body,category,image_url};const result=editing?await db.from("prompts").update(payload).eq("id",editing):await db.from("prompts").insert(payload);if(result.error)return alert("저장 실패: "+result.error.message);closeEditor();load();};
$("grid").onclick=async e=>{const c=e.target.closest("[data-copy]"),ed=e.target.closest("[data-edit]"),del=e.target.closest("[data-del]");if(c){const x=items.find(a=>String(a.id)===c.dataset.copy);try{await navigator.clipboard.writeText(x.body);c.textContent="✓ 복사 완료";}catch{alert("클립보드 복사 권한을 확인해 주세요.");}setTimeout(()=>c.textContent="▣ 프롬프트 복사",1400);}if(ed){const x=items.find(a=>String(a.id)===ed.dataset.edit);if(x)openEditor(x);}if(del){if(!confirm("이 프롬프트를 삭제할까요?"))return;const r=await db.from("prompts").delete().eq("id",del.dataset.del);if(r.error)alert(r.error.message);else load();}};
$("authBtn").onclick=()=>{if(user){db.auth.signOut();user=null;render();}else $("authBack").classList.add("open");};$("authCancel").onclick=()=>$("authBack").classList.remove("open");
$("login").onclick=async()=>{if(!db){$("authMsg").textContent="index.html의 Supabase URL과 anon key를 입력해 주세요.";return;}const {data,error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error){$("authMsg").textContent=error.message;return;}user=data.user;$("authBack").classList.remove("open");render();};
if(db)db.auth.onAuthStateChange((_e,session)=>{user=session?.user||null;render()});load();
</script></body></html>
